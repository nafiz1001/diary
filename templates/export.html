{% extends "base.html" %}

{% block title %}Diary | Export {{id}}{% endblock %}

{% block content %}
<form id="filter-form" method="get" action="/export">
    <table>
      <tr>
        <td><label for="created_since">Created since:</label></td>
        <td><input name="created_since" type="date"/></td>
      </tr>
      <tr>
        <td><label>Order: </label></td>
        <td>
          <select name="order">
            <option value="created_at">Ascending</option>
            <option value="-created_at">Descending</option>
          </select>
        </td>
      </tr>
      <tr>
        <td><label>Format: </label></td>
        <td>
          <select name="format">
            <option value="markdown">diary.md</option>
            <option value="tsv">diary.tsv</option>
          </select>
        </td>
      </tr>
    </table>
    <button type="submit">Export</button>
  </form>
{% endblock %}
