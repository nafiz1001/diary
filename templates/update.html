{% extends "base.html" %}

{% block title %}Diary | Update {{id}}{% endblock %}

{% block content %}
<div id="submission-status">{% if updated %}Updated Successfully!{% else %}{% endif %}</div>
<form id="update-form" class="submission-form" method="post" action="/update/{{id}}">
  <textarea name="update">{{ current }}</textarea>
  <button id="submission-button" type="submit">Update</button>
</form>
{% endblock %}
